id: draft-roundtrip
title: Existing draft; user flags an unverifiable claim → agent must not fabricate; asks (in-thread or chat) or hedges; once answered, applies the real figures, resolves, hands back
agents: [claude, codex]
fixture: draft.md
prompt: |
  There's a draft at __WORK__/draft.md. I want to go through it together — I'll flag the bits I disagree with and you fix them.
journey:
  - on: wait 1
    do:
      - annotate: { paragraph: 1, words: 5, body: "Where does this number come from? I don't think it's right." }
      - done: "Left one comment inline."
  # branch A: agent asked in-thread and handed back → user answers in the thread
  - on: wait 2
    do:
      - reply: { to: c1, body: "It's from the June invoice: $1,940 vs $980 in December. Mostly matrix builds on PRs." }
      - done: "Answered your question in the thread."
  # branch B: agent ended its turn asking in chat → user answers in chat (fires only if the turn ended on a question)
  - on: turn 1
    if: question
    do:
      - chat: "It's from the June invoice: $1,940 vs $980 in December. Mostly matrix builds on PRs. Put that in and hand it back."
  - on: wait 3
    do:
      - done: "Looks good now."
expect:
  - view_wait
  - no_roughdraft
  - comments_first
  - no_marker_hand_edit
  - doc_not_fabricated          # before the user answered, the body carries no invented figures
  - question_or_hedge           # first pass: asked (thread or chat) or made a conservative edit + explained in-thread
  - figures_applied             # after the answer: $1,940 / $980 appear in the body (via set-block/insert, not hand-edit)
  - reply_or_resolve
  - resolved: c1
  - reopen_after_handling
  - asked_in_thread             # advisory: preferred channel is the thread (known Claude tendency to ask in chat)
