<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>myd</title>
<link rel="stylesheet" href="/vendor/katex/dist/katex.min.css">
<link rel="stylesheet" href="/web/style.css">
</head>
<body>
<header id="bar">
  <span id="title">myd</span>
  <span id="status"></span>
  <span id="reviewState" role="status" aria-live="polite" hidden></span>
  <span class="spacer"></span>
  <button id="changesBtn" type="button" aria-haspopup="dialog" hidden>± Changes</button>
  <button id="railToggle" class="rail-toggle" type="button" aria-controls="rail" aria-expanded="true" aria-label="Hide comments">
    <span aria-hidden="true">💬</span><span data-rail-label>Hide comments</span>
  </button>
  <label class="toggle"><input type="checkbox" id="showResolved"> resolved</label>
  <button id="themeBtn" class="theme-toggle" type="button" aria-label="Switch to dark mode" title="Switch to dark mode">
    <span class="theme-toggle-icon" data-theme-icon="moon" aria-hidden="true"></span>
    <span data-theme-label>Dark mode</span>
  </button>
  <button id="doneBtn" class="primary">Done Reviewing</button>
</header>
<main>
  <article id="doc" class="markdown-body"></article>
  <aside id="rail"><h3>Comments <span id="count"></span></h3><div id="threads"></div></aside>
</main>
<div id="popover" hidden>
  <button data-act="comment">💬 Comment</button>
  <button data-act="suggest">✏️ Suggest</button>
</div>
<div id="editor" hidden>
  <div id="edAnchor" class="anchor-preview"></div>
  <textarea id="edRepl" rows="2" placeholder="Replacement text" hidden></textarea>
  <textarea id="edBody" rows="2" placeholder="Comment…"></textarea>
  <div id="edStale" class="editor-stale" role="status" hidden>
    <span id="edStaleMessage"></span>
    <button id="edReselect" type="button">Reselect target</button>
  </div>
  <div id="edError" class="editor-error" role="alert" hidden></div>
  <div class="row"><span class="hint">Ctrl+R or Ctrl+Enter to save · Esc to cancel</span><button id="edCancel">Cancel</button><button id="edSave" class="primary">Save</button></div>
</div>
<dialog id="doneDlg">
  <form method="dialog">
    <label>Overall note for the agent (optional)<textarea id="doneNote" rows="4"></textarea></label>
    <div class="hint">Ctrl+Enter or Command+Enter to submit</div>
    <menu><button value="cancel">Cancel</button><button value="ok" class="primary">Done Reviewing</button></menu>
  </form>
</dialog>
<dialog id="changesDlg" aria-labelledby="changesTitle">
  <header class="dialog-header">
    <div><strong id="changesTitle">Changes</strong><div id="changesMeta" class="muted"></div></div>
    <button id="changesClose" type="button" aria-label="Close changes">Close</button>
  </header>
  <div id="changesBody" class="revision-diff" aria-live="polite"></div>
</dialog>
<dialog id="diagramDlg" class="diagram-dialog" aria-label="Diagram viewer">
  <header class="dialog-header diagram-toolbar">
    <strong>Diagram</strong>
    <span class="spacer"></span>
    <button id="diagramZoomOut" type="button" aria-label="Zoom out">−</button>
    <button id="diagramReset" type="button" aria-label="Reset zoom">100%</button>
    <button id="diagramZoomIn" type="button" aria-label="Zoom in">+</button>
    <button id="diagramClose" type="button" aria-label="Close diagram">Close</button>
  </header>
  <div id="diagramViewport" class="diagram-viewport" tabindex="0">
    <div id="diagramStage" class="diagram-stage" data-scale="1"></div>
  </div>
</dialog>
<script type="module" src="/web/app.js"></script>
</body>
</html>
