name: CI

on:
  # Only mainline pushes: a branch with a PR is already covered by the pull_request
  # run, and triggering both put them in one concurrency group where the later
  # cancelled the earlier — which GitHub then showed as a failing check.
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v6

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Typecheck
        run: bun run typecheck

      - name: Unit tests
        run: bun test

      # No browser to install: the runner image ships Google Chrome, and the e2e
      # suites already prefer a system browser over a managed one (the Bun.which
      # fallback in src/*.e2e.ts). Installing playwright's chromium fetched a
      # second browser nothing launched, and --with-deps put the job at the mercy
      # of apt — 207s on a good run, and 867s on the one that hit the job timeout.
      # Printing the version fails loudly if an image ever drops Chrome, and
      # records which build ran when a browser update breaks something.
      - name: Browser regression tests
        run: |
          google-chrome --version
          bun run test:e2e
